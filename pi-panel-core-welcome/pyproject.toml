[project]
name = "pi-panel-welcome"
version = "0.1.0"
description = "pi-panel's welcome screen: shown when no app is, with what to do next"
requires-python = ">=3.11"
license = { text = "MIT" }

# GTK (PyGObject) is deliberately not listed: it comes from apt and is seen
# through the venv's --system-site-packages.
dependencies = [
    "pi-panel-varlink",
]

[project.scripts]
pi-panel-welcome = "pi_panel_welcome.__main__:main"

[tool.uv.sources]
pi-panel-varlink = { path = "../pi-panel-core-ctl/packages/pi-panel-varlink" }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_welcome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
