# pi-panel compositor config — /etc/pi-panel/compositor.conf
#
# Format (one view per non-comment line):
#   <name>  <auto-restart: yes|no>  <shell command>
#
# name         — used with IPC "switch-name <name>" command
# auto-restart — "yes" to automatically re-launch if the process exits
# command      — executed via /bin/sh, with WAYLAND_DISPLAY set automatically
#
# Notes:
#   - SDL2 apps: WAYLAND_DISPLAY is set for you; SDL will use Wayland automatically.
#     If the app also needs to suppress X11 fallback, add:  SDL_VIDEODRIVER=wayland
#   - The compositor sets WAYLAND_DISPLAY and unsets DISPLAY before exec.
#   - Lines starting with # are comments; blank lines are ignored.

# Example kiosk panels:
dashboard   yes   python3 /home/pi/apps/dashboard.py
browser     no    chromium-browser --kiosk --no-sandbox http://localhost:3000
media       no    mpv --fullscreen --loop-playlist=inf /home/pi/media/playlist.m3u
