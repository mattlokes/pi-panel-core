[project]
name = "pi-panel-tui-kit"
version = "0.1.0"
description = "Shared Textual building blocks for the pi-panel TUIs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["textual>=8.2,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_tui_kit"]
