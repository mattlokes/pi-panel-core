[project]
name = "pi-panel-plugin-mqtt"
version = "0.2.0"
description = "pi-panel plugin: bridges io.pipanel.Ctl to MQTT and Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Async MQTT: `async for message in client.messages` runs as an ordinary
    # coroutine on the same loop as the Varlink subscription.
    "aiomqtt>=2.5,<3",
    "pi-panel-varlink",
]

[project.scripts]
pi-panel-mqtt = "pi_panel_mqtt.__main__:main"

# Installed by pi-panel-pkg into ~/pi-panel-plugin/mqtt, next to ~/pi-panel-core.
[tool.uv.sources]
pi-panel-varlink = { path = "../../pi-panel-core/pi-panel-core-ctl/packages/pi-panel-varlink" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_mqtt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
