[project]
name = "pi-panel-mqtt"
version = "0.3.0"
description = "pi-panel's MQTT bridge: io.pipanel.Ctl to MQTT and Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Async MQTT: `async for message in client.messages` runs as an ordinary
    # coroutine on the same loop as the Varlink subscription.
    "aiomqtt>=2.5,<3",
    "pi-panel-varlink",
]

[project.scripts]
pi-panel-mqtt = "pi_panel_mqtt.__main__:main"

# A member of pi-panel-core-ctl's workspace: `uv sync --all-packages` there
# installs it into ctl's venv, and pi-panel-mqtt.service runs it from there.
[tool.uv.sources]
pi-panel-varlink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_panel_mqtt"]

# Tests run from the workspace root (its pytest settings apply).
